name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript check
        run: npm run lint

      - name: Build web assets
        env:
          VITE_BASE_PATH: ./
        run: npm run build

      - name: Install Capacitor Android
        run: npm install --no-save --legacy-peer-deps --no-audit --no-fund @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8

      - name: Generate Android project & sync
        run: |
          rm -rf android
          npx cap add android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp -f public/pwa-192x192.png "$dir/ic_launcher.png"
              cp -f public/pwa-192x192.png "$dir/ic_launcher_round.png"
            fi
          done
          if [ -d android/app/src/main/res/mipmap-xxxhdpi ]; then
            cp -f public/pwa-512x512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp -f public/pwa-512x512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../DompetVault-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DompetVault-APK
          path: DompetVault-debug.apk
          retention-days: 30
